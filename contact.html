<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0f1f" />
  <title>eBarga AI Contact</title>
  <link rel="icon" href="favicon.png" />
  <link rel="stylesheet" href="style.css" />
  <script src="app.js" defer></script>
</head>
<body data-page="contact" onload="bootContact()">
  <header class="topbar shell">
    <a class="brand" href="index.html">
      <img src="logo.png" alt="eBarga AI logo" class="brand-logo" />
      <span>eBarga AI</span>
    </a>
    <nav class="nav">
      <a href="payment.html">Payment</a>
      <a href="features.html">Features</a>
      <a href="dashboard.html">Dashboard</a>
    </nav>
  </header>

  <main class="shell">
    <section class="card hero compact">
      <p class="eyebrow">Support center</p>
      <h1>Contact us</h1>
      <p class="lead">Choose the fastest channel below and our team will reply as soon as possible.</p>
    </section>

    <section class="grid-3 mt-24 contact-grid">
      <a class="contact-tile card" href="https://wa.me/15551234567" target="_blank" rel="noreferrer">
        <span class="tile-icon">WhatsApp</span>
        <strong>Message us</strong>
      </a>
      <a class="contact-tile card" href="https://facebook.com/yourpage" target="_blank" rel="noreferrer">
        <span class="tile-icon">Facebook</span>
        <strong>Visit page</strong>
      </a>
      <a class="contact-tile card" href="mailto:support@ebargaai.com">
        <span class="tile-icon">Gmail</span>
        <strong>Send email</strong>
      </a>
    </section>

    <p class="center muted mt-24">Contact us and our team will reply as soon as possible.</p>

    <div class="center mt-24">
      <button class="btn btn-ghost btn-small contact-float" type="button" onclick="goToSupport()">Trouble? Contact us!</button>
    </div>
  </main>
</body>
</html>
